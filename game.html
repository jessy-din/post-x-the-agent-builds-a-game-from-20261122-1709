<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Catcher — a tiny game built from one prompt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b1026; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px; color: #fff; pointer-events: none;
    font-weight: 700; font-size: 26px; text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  #hud .pill {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 8px 20px;
  }
  #hud .pill b { color: #ffd94d; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #fff; background: rgba(6, 8, 30, .55); cursor: pointer;
  }
  #overlay h1 {
    font-size: 84px; letter-spacing: 2px; line-height: 1;
    background: linear-gradient(90deg, #ffd94d, #ff7ad9, #7ad9ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,.7));
  }
  #overlay p { font-size: 26px; margin-top: 18px; color: #dfe6ff; max-width: 760px; line-height: 1.5; }
  #overlay .cta {
    margin-top: 34px; font-size: 24px; font-weight: 800; color: #0b1026;
    background: #ffd94d; border-radius: 999px; padding: 16px 42px;
    box-shadow: 0 8px 30px rgba(255, 217, 77, .45);
  }
  #overlay .hint { font-size: 18px; margin-top: 22px; color: #9fb0e8; }
  #overlay.hidden { display: none; }
  #toast {
    position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    font-size: 30px; font-weight: 800; color: #ffd94d;
    text-shadow: 0 2px 10px rgba(0,0,0,.7); opacity: 0; transition: opacity .2s;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="pill">⭐ SCORE <b id="score">0</b></div>
    <div class="pill">⏱ <b id="time">60</b>s</div>
    <div class="pill">❤️ <b id="lives">3</b></div>
  </div>
  <div id="toast"></div>
  <div id="overlay">
    <h1>⭐ STAR CATCHER</h1>
    <p>Catch the falling stars in your basket. Golden stars are worth more.
       Dodge the bombs — three hits and the night is over. You have 60 seconds.</p>
    <div class="cta">▶ CLICK TO PLAY</div>
    <div class="hint">Move with your mouse or ← → arrow keys &nbsp;•&nbsp; Built from one prompt by an AI agent</div>
  </div>
</div>
<script>
"use strict";
// STAR CATCHER — built from one prompt:
// "a basket catches falling stars, bombs cost a life, 60 seconds on the clock"
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const timeEl = document.getElementById("time");
const livesEl = document.getElementById("lives");
const overlay = document.getElementById("overlay");
const toast = document.getElementById("toast");
const params = new URLSearchParams(location.search);
const DEMO = params.get("demo") === "1"; // autopilot: the basket plays itself

let W = 0, H = 0;
function resize() {
  W = canvas.width = innerWidth * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
}
addEventListener("resize", resize);
resize();

const S = devicePixelRatio;
const state = {
  running: false, over: false,
  score: 0, lives: 3, timeLeft: 60,
  basketX: 0, basketTarget: 0,
  items: [], particles: [], starsBg: [],
  spawnT: 0, elapsed: 0, lastTs: 0,
};
for (let i = 0; i < 90; i++) {
  state.starsBg.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.8 + 0.6, tw: Math.random() * Math.PI * 2 });
}

const BASKET_W = 150 * S, BASKET_H = 34 * S, BASKET_Y_OFF = 96 * S;

function basketY() { return H - BASKET_Y_OFF; }
function toastMsg(msg, color) {
  toast.textContent = msg;
  toast.style.color = color || "#ffd94d";
  toast.style.opacity = "1";
  setTimeout(() => { toast.style.opacity = "0"; }, 700);
}
function spawnItem() {
  const roll = Math.random();
  const kind = roll < 0.14 ? "bomb" : roll < 0.32 ? "gold" : "star";
  const speed = (2.1 + Math.random() * 1.6 + state.elapsed / 60 * 1.6) * S * 60 / 60;
  state.items.push({
    kind,
    x: 40 * S + Math.random() * (W - 80 * S),
    y: -40 * S,
    vy: (140 + Math.random() * 120 + state.elapsed * 2.2) * S / 60,
    r: (kind === "gold" ? 26 : 22) * S,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.06,
    sway: Math.random() * Math.PI * 2,
  });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 200) * S / 60;
    state.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40 * S / 60, life: 0.55, color });
  }
}
function update(dt) {
  state.elapsed += dt;
  state.timeLeft = Math.max(0, 60 - state.elapsed);
  timeEl.textContent = Math.ceil(state.timeLeft);
  if (state.timeLeft <= 0) { endGame(true); return; }

  // basket follows pointer, keys, or the autopilot in demo mode
  if (DEMO) {
    let best = null, bestY = -1;
    for (const it of state.items) {
      if (it.kind !== "bomb" && it.y > bestY) { best = it; bestY = it.y; }
    }
    if (best) state.basketTarget = best.x;
    // sidestep a bomb dropping straight onto the basket
    for (const it of state.items) {
      if (it.kind === "bomb" && it.y > basketY() - 320 * S &&
          Math.abs(it.x - state.basketX) < BASKET_W / 2 + 30 * S) {
        state.basketTarget = it.x < state.basketX
          ? state.basketX + 220 * S : state.basketX - 220 * S;
        break;
      }
    }
    state.basketTarget = Math.max(BASKET_W / 2, Math.min(W - BASKET_W / 2, state.basketTarget));
  }
  const dx = state.basketTarget - state.basketX;
  state.basketX += dx * Math.min(1, dt * 14);

  state.spawnT -= dt;
  if (state.spawnT <= 0) {
    spawnItem();
    state.spawnT = Math.max(0.28, 0.85 - state.elapsed / 60 * 0.45);
  }
  const by = basketY();
  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    it.y += it.vy * dt * 60;
    it.rot += it.vr;
    it.sway += dt * 2;
    it.x += Math.sin(it.sway) * 0.4 * S;
    const caught = it.y + it.r >= by - 6 * S && it.y < by + BASKET_H &&
      Math.abs(it.x - state.basketX) < BASKET_W / 2 + it.r * 0.4;
    if (caught) {
      if (it.kind === "bomb") {
        state.lives -= 1;
        livesEl.textContent = state.lives;
        burst(it.x, it.y, "#ff4d4d", 26);
        toastMsg("💣 BOOM! -1 life", "#ff6b6b");
        if (state.lives <= 0) { endGame(false); return; }
      } else if (it.kind === "gold") {
        state.score += 25;
        burst(it.x, it.y, "#ffd94d", 20);
        toastMsg("+25 GOLD!", "#ffd94d");
      } else {
        state.score += 10;
        burst(it.x, it.y, "#7ad9ff", 12);
      }
      scoreEl.textContent = state.score;
      state.items.splice(i, 1);
    } else if (it.y - it.r > H) {
      if (it.kind === "star") { /* a star missed: no penalty, keep it friendly */ }
      state.items.splice(i, 1);
    }
  }
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 3 * S / 60; p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
}

function drawStar(x, y, r, rot, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = i * Math.PI / 5 - Math.PI / 2;
    i === 0 ? ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.shadowColor = color; ctx.shadowBlur = 18 * S;
  ctx.fill();
  ctx.restore();
}
function drawBomb(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = "#23232e"; ctx.shadowColor = "#ff4d4d"; ctx.shadowBlur = 14 * S; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.3, r * 0.28, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fill();
  ctx.strokeStyle = "#ffd94d"; ctx.lineWidth = 3 * S;
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.5, -r * 1.5, r * 0.8, -r * 1.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(r * 0.85, -r * 1.25, 4 * S, 0, Math.PI * 2);
  ctx.fillStyle = "#ff9d00"; ctx.fill();
  ctx.restore();
}
function render(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0b1026"); g.addColorStop(0.6, "#1a2350"); g.addColorStop(1, "#3a1c5e");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // twinkling background stars
  for (const s of state.starsBg) {
    const a = 0.35 + 0.35 * Math.sin(t / 500 + s.tw);
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r * S, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // moon (kept clear of the HUD pills at the top)
  ctx.beginPath(); ctx.arc(300 * S, 170 * S, 52 * S, 0, Math.PI * 2);
  ctx.fillStyle = "#f5f0d8"; ctx.shadowColor = "#f5f0d8"; ctx.shadowBlur = 40 * S; ctx.fill();
  ctx.shadowBlur = 0;
  // falling items
  for (const it of state.items) {
    if (it.kind === "bomb") drawBomb(it.x, it.y, it.r, it.rot);
    else drawStar(it.x, it.y, it.r, it.rot, it.kind === "gold" ? "#ffd94d" : "#7ad9ff");
  }
  // particles
  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.55);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4 * S, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // ground
  ctx.fillStyle = "#120a24";
  ctx.fillRect(0, H - 26 * S, W, 26 * S);
  // basket
  const by = basketY();
  ctx.save();
  ctx.translate(state.basketX, by);
  ctx.fillStyle = "#b5722f";
  ctx.beginPath();
  ctx.moveTo(-BASKET_W / 2, 0); ctx.lineTo(BASKET_W / 2, 0);
  ctx.lineTo(BASKET_W / 2 - 16 * S, BASKET_H); ctx.lineTo(-BASKET_W / 2 + 16 * S, BASKET_H);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#d99a45";
  ctx.fillRect(-BASKET_W / 2, -8 * S, BASKET_W, 10 * S);
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 2 * S;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(i * BASKET_W / 4, 2 * S); ctx.lineTo(i * BASKET_W / 4 + 8 * S, BASKET_H - 2 * S); ctx.stroke();
  }
  ctx.restore();
}
function loop(ts) {
  if (!state.running) return;
  const dt = Math.min(0.05, (ts - state.lastTs) / 1000 || 0.016);
  state.lastTs = ts;
  update(dt);
  render(ts);
  if (!state.over) requestAnimationFrame(loop);
}
function startGame() {
  state.running = true; state.over = false;
  state.score = 0; state.lives = 3; state.elapsed = 0; state.timeLeft = 60;
  state.items = []; state.particles = []; state.spawnT = 0.3;
  state.basketX = W / 2; state.basketTarget = W / 2;
  scoreEl.textContent = "0"; livesEl.textContent = "3"; timeEl.textContent = "60";
  overlay.classList.add("hidden");
  state.lastTs = performance.now();
  requestAnimationFrame(loop);
}
function endGame(timeUp) {
  state.over = true; state.running = false;
  overlay.classList.remove("hidden");
  overlay.querySelector("h1").textContent = timeUp ? "⏱ TIME'S UP!" : "💥 GAME OVER";
  overlay.querySelector("p").innerHTML =
    `You caught <b style="color:#ffd94d">${state.score} points</b> worth of stars in 60 seconds.` +
    `<br>Think you can beat it?`;
  overlay.querySelector(".cta").textContent = "↻ PLAY AGAIN";
}
addEventListener("pointermove", (e) => { state.basketTarget = e.clientX * S; });
addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") state.basketTarget = Math.max(BASKET_W / 2, state.basketTarget - 60 * S);
  if (e.key === "ArrowRight") state.basketTarget = Math.min(W - BASKET_W / 2, state.basketTarget + 60 * S);
});
overlay.addEventListener("click", startGame);
// idle attract mode behind the title screen
state.basketX = W / 2; state.basketTarget = W / 2;
(function attract(ts) {
  if (state.running) return;
  render(ts || 0);
  if (!state.running) requestAnimationFrame(attract);
})(0);
if (DEMO) startGame();
</script>
</body>
</html>
